# Deploys Concertium to Hostinger over SSH on every push to main.
#
# One-time setup — add just TWO repository secrets
# (GitHub → repo → Settings → Secrets and variables → Actions → Repository secrets):
#
#   HOSTINGER_HOST     the SSH IP from hPanel → Advanced → SSH Access
#   HOSTINGER_SSH_KEY  the PRIVATE SSH key whose public half is added to Hostinger
#                      (hPanel → Advanced → SSH Access → Manage SSH keys)
#
# The non-sensitive values (user, port, app dir, Node activate) are baked in
# below — change them here if your account/paths differ.
#
# The server must already be a git checkout of this repo that can `git pull`
# (see docs/GO-LIVE.md / the deploy-key setup).

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

env:
  HOSTINGER_USER: u294070911
  HOSTINGER_PORT: "65002"
  HOSTINGER_APP_DIR: /home/u294070911/domains/lindenlaub.cloud/nodejs
  NODE_ACTIVATE: /home/u294070911/nodevenv/domains/lindenlaub.cloud/nodejs/22/bin/activate

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          missing=0
          if [ -z "${{ secrets.HOSTINGER_HOST }}" ]; then
            echo "::error::HOSTINGER_HOST secret is not set."
            missing=1
          fi
          if [ -z "${{ secrets.HOSTINGER_SSH_KEY }}" ]; then
            echo "::error::HOSTINGER_SSH_KEY secret is not set."
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "Add them under Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          echo "✓ Required secrets are present."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ env.HOSTINGER_PORT }}
          username: ${{ env.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            source "${{ env.NODE_ACTIVATE }}"
            cd "${{ env.HOSTINGER_APP_DIR }}"

            echo "→ Pulling latest main"
            # Hostinger shared hosting caps threads — keep git single-threaded
            # and shallow so 'git fetch' doesn't hit "unable to create thread".
            git config pack.threads 1 || true
            git fetch --depth=1 origin main
            git reset --hard origin/main

            echo "→ Installing dependencies"
            npm install --no-audit --no-fund

            echo "→ Syncing database schema"
            npx prisma generate
            npx prisma db push --skip-generate

            echo "→ Building"
            npm run build

            echo "→ Restarting app"
            mkdir -p tmp && touch tmp/restart.txt
            echo "✓ Deploy complete"
